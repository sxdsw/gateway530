<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway 530</title>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Encode+Sans:wght@100..900&family=Fira+Code:wght@300..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Goudy+Bookletter+1911&family=Handjet:wght,ELSH@100..900,2&family=Inconsolata:wght@200..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lexend+Deca:wght@100..900&family=Overpass+Mono:wght@300..700&family=PT+Sans+Narrow:wght@400;700&family=Pangolin&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: rgb(0, 0, 11);
    --white: azure ;
    --dim: #555;
    --accent: #c0392b;
    --mono: 'Share Tech Mono', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: var(--mono);
    overflow: hidden;
    cursor: none;
  }

  #scene {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 9vw;
    gap: 0;
  }


  #heading {
    font-family: var(--mono);
    font-size: clamp(52px, 8vw, 110px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--white);
    opacity: 0;
    transform: translateY(18px);
    animation: fadeUp .7s cubic-bezier(.22,1,.36,1) .1s forwards;
  }

  #bar-wrap {
    margin-top: clamp(28px, 4vh, 52px);
    opacity: 0;
    animation: fadeUp .7s cubic-bezier(.22,1,.36,1) .3s forwards;
  }

  #bar {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .blk {
    width: clamp(32px, 3.8vw, 58px);
    height: clamp(42px, 5.5vh, 68px);
    border-radius: 0;
    background: rgb(0, 0, 11);
    flex-shrink: 0;
    transition: background .1s ease, border-color .1s ease, box-shadow .1s ease;
  }

  .blk.lit {
    background: var(--white);
    border-color: var(--white);
    box-shadow: 0 0 8px rgba(229, 244, 251, 0.983);
  }

 
  .blk.active {
    background: var(--white);
    border-color: var(--white);
    box-shadow: 0 0 8px rgba(229, 244, 251, 0.983);
    animation: pulse .5s ease infinite alternate;
  }

  #body-text {
    margin-top: clamp(36px, 5vh, 72px);
    opacity: 0;
    animation: fadeUp .7s cubic-bezier(.22,1,.36,1) .1s forwards;
  }

  #body-text p {
    font-family: var(--mono);
    font-size: 1.2rem;
    font-weight: 300;
    line-height: 1.75;
    color: var(--white);
    letter-spacing: 0.01em;
  }

  #body-text p + p { margin-top: 1.2em; }

  #body-text .enter-hint {
    color: var(--white);
  }

  #body-text .enter-hint kbd {
    font-family: var(--mono);
    font-size: inherit;
    padding: 1px 5px;
    color: var(--white);
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .neon-glow {
    color: rgba(240, 255, 255, 0.92);

    text-shadow:
        0 0 1px rgba(196, 227, 224, 0.741),
        0 0 1px rgba(173, 255, 255, 0.792),
        0 0 2px rgba(241, 255, 255, 0.928);

    transition:
        text-shadow 0.4s ease,
        opacity 0.4s ease;
}
</style>
</head>
<body>

<div id="scene" class="neon-glow">
  <h1 id="heading">Connecting you to<br>Gateway 530</h1>

  <div id="bar-wrap">
    <div id="bar" class="neon-glow"></div>
  </div>

  <div id="body-text" class="neon-glow">
    <p>Do you remember how we used to find each other on forgotten lines?<br>
       I hope the red string brings you back to me.</p>
    <p class="enter-hint">If you see this, press <kbd>&lt;enter&gt;</kbd>. I want to talk to you again.</p>
  </div>
</div>

<script>

  const TOTAL   = 15;
  const STEP_MS = 130;
  const PAUSE_MS = 400;
  const bar = document.getElementById('bar');
  const blocks = [];

  for (let i = 0; i < TOTAL; i++) {
    const b = document.createElement('div');
    b.className = 'blk';
    bar.appendChild(b);
    blocks.push(b);
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function runCycle() {
    for (let i = 0; i < TOTAL; i++) {
      if (i > 0) blocks[i-1].classList.remove('active');
      blocks[i].classList.add('lit', 'active');
      await sleep(STEP_MS);
    }
    blocks[TOTAL-1].classList.remove('active');
    await sleep(PAUSE_MS);

    // clear all at once
    blocks.forEach(b => b.classList.remove('lit', 'active'));
    await sleep(PAUSE_MS);
  }

  /* ── Determine cycles & loop ── */
  let running = true;

  async function loopBar() {
    while (running) {
      await runCycle();
    }
  }

  // Start after heading animation settles
  setTimeout(loopBar, 1100);

  /* ── Enter key triggers connection ── */
  let connected = false;

  async function connect() {
    if (connected) return;
    connected = true;
    running = false;

    // Finish current step gracefully, then light all
    await sleep(STEP_MS * 2);
    blocks.forEach(b => { b.classList.remove('active'); b.classList.add('lit'); });
    await sleep(500);

    // Fade out scene then navigate
    const scene = document.getElementById('scene');
    scene.style.transition = 'opacity .6s ease';
    scene.style.opacity = '0';
    await sleep(250);

    window.location.href = 'gateway530.html';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') connect();
  });

  // Also allow tap on mobile
  document.addEventListener('click', connect);
</script>
</body>
</html>
